<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Berbudaya - Platform Jejaring Kebudayaan & Social Commerce Indonesia</title>
    <meta name="description" content="Berbudaya (berbudaya.web.id) adalah platform jejaring sosial kebudayaan dan social commerce Indonesia. Ruang kolaborasi seniman, marketplace kerajinan nusantara, dan crowdfunding pelestarian budaya." />
    <meta name="keywords" content="berbudaya, berbudaya id, berbudaya web id, web berbudaya, platform berbudaya, jejaring kebudayaan, jejaring sosial budaya indonesia, social commerce budaya, marketplace kerajinan nusantara, komunitas seni budaya, crowdfunding budaya" />
    <meta name="author" content="Berbudaya" />
    <link rel="canonical" href="https://berbudaya.web.id/" />
    
    <!-- PWA Manifest & Mobile Config -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#C45A34" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Berbudaya" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Berbudaya - Platform Jejaring Kebudayaan & Social Commerce Indonesia" />
    <meta property="og:description" content="Platform jejaring kebudayaan dan social commerce Indonesia: wadah interaksi pegiat seni, marketplace produk budaya lokal, dan crowdfunding pelestarian tradisi." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://berbudaya.web.id/" />
    <meta property="og:image" content="https://berbudaya.web.id/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Berbudaya - Platform Jejaring Kebudayaan & Social Commerce Indonesia" />
    <meta name="twitter:description" content="Jejaring sosial kebudayaan dan etalase karya budaya lokal Indonesia di berbudaya.web.id" />
    <meta name="twitter:image" content="https://berbudaya.web.id/logo.png" />

    <!-- Structured Data (JSON-LD) for Google Search & Google AI Overview -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://berbudaya.web.id/#organization",
          "name": "Berbudaya",
          "alternateName": ["Berbudaya.web.id", "Platform Berbudaya", "Jejaring Kebudayaan Indonesia"],
          "url": "https://berbudaya.web.id",
          "logo": "https://berbudaya.web.id/logo.png",
          "description": "Platform jejaring kebudayaan terintegrasi dan social commerce produk budaya Indonesia.",
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "@id": "https://berbudaya.web.id/#website",
          "url": "https://berbudaya.web.id",
          "name": "Berbudaya",
          "alternateName": "Platform Berbudaya Indonesia",
          "publisher": {
            "@id": "https://berbudaya.web.id/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://berbudaya.web.id/marketplace?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
    
    <!-- Preconnect to Google Fonts & CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://images.unsplash.com">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/react-app/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>

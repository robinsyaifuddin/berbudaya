<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Berbudaya.id - Jejaring Sosial Budaya Indonesia</title>
    <meta name="description" content="Platform jejaring sosial yang menghubungkan pelaku budaya, pengrajin, komunitas, dan pecinta seni budaya Indonesia." />
    <meta name="keywords" content="budaya indonesia, seni tradisional, batik, wayang, komunitas budaya, marketplace budaya, crowdfunding budaya" />
    <meta name="author" content="Berbudaya.id" />
    
    <!-- PWA Manifest & Mobile Config -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#C45A34" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Berbudaya" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Berbudaya.id - Jejaring Sosial Budaya Indonesia" />
    <meta property="og:description" content="Platform jejaring sosial yang menghubungkan pelaku budaya Indonesia" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://Berbudaya.id" />
    <meta property="og:image" content="https://Berbudaya.id/logo.png" />
    
    <!-- Preconnect to Google Fonts & CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://images.unsplash.com">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/react-app/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
